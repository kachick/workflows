name: '[Reusable] Automerge bot PRs'

on:
  workflow_call:
    inputs:
      app-id:
        description: 'GitHub App ID or Client ID'
        required: true
        type: string
      merge-method:
        description: 'Merge method for pull requests (squash, merge, or rebase)'
        required: false
        type: string
        default: 'squash'
      allowed-bots:
        description: 'Comma-separated list of allowed bot logins'
        required: false
        type: string
        default: ''
      llm-final-veto:
        description: 'Enable LLM-based final veto review before merging'
        required: false
        type: boolean
        default: false
      gemini-model:
        description: 'Gemini model name for LLM final veto'
        required: false
        type: string
        default: 'gemini-flash-latest'
    secrets:
      APP_PRIVATE_KEY:
        description: 'GitHub App private key'
        required: true
      GEMINI_API_KEY:
        description: 'Gemini API key for LLM final veto review'
        required: false

permissions:
  contents: read

jobs:
  automerge:
    name: Automerge
    # Use fixed runner image for internal chore workflows as documented in NOTES.md
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Generate GitHub Apps token
        id: publish-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          # access-tokens: Prevent GitHub API rate limiting during `nix run github:`
          extra-conf: |
            access-tokens = github.com=${{ github.token }}

      - name: Merge eligible bot PRs
        env:
          GH_TOKEN: ${{ steps.publish-token.outputs.token }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          MERGE_METHOD: ${{ inputs.merge-method }}
          ALLOWED_BOTS: ${{ inputs.allowed-bots }}
          LLM_FINAL_VETO: ${{ inputs.llm-final-veto }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.gemini-model }}
        run: |
          set -euo pipefail

          if [ -n "${WORKFLOW_REPOSITORY}" ] && [ -n "${WORKFLOW_SHA}" ]; then
            FLAKE_REF="github:${WORKFLOW_REPOSITORY}/${WORKFLOW_SHA}"
          else
            FLAKE_REF="."
          fi

          nix run "${FLAKE_REF}#automerge" -- \
            --merge-method="${MERGE_METHOD}" \
            --allowed-bots="${ALLOWED_BOTS}" \
            --llm-final-veto="${LLM_FINAL_VETO}" \
            --gemini-model="${GEMINI_MODEL}"
