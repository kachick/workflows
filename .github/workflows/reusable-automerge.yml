name: '[Reusable] Automerge bot PRs'

on:
  workflow_call:
    inputs:
      app-id:
        description: 'GitHub App ID or Client ID'
        required: true
        type: string
      merge-method:
        description: 'Merge method for pull requests (squash, merge, or rebase)'
        required: false
        type: string
        default: 'squash'
      allowed-bots:
        description: 'Comma-separated list of allowed bot logins'
        required: false
        type: string
        default: ''
      llm-veto:
        description: 'Enable LLM-based veto review before merging'
        required: false
        type: boolean
        default: false
      gemini-model:
        description: 'Gemini model name for LLM veto'
        required: false
        type: string
        default: 'gemini-flash-latest'
      reviewer:
        description: 'GitHub login to request review on veto or block'
        required: false
        type: string
        # Why not automatic repo owner:
        # GitHub API requested_reviewers accepts only individual user logins or team slugs, not generic roles like 'admin'.
        # Repository owners can also be organizations which cannot be directly requested as reviewers.
        # Because this workflow is specialized for personal use (guarded by kachick ownership above),
        # defaulting to 'kachick' is the simplest choice without fragile dynamic collaborator lookups.
        default: 'kachick'
    secrets:
      APP_PRIVATE_KEY:
        description: 'GitHub App private key'
        required: true
      GEMINI_API_KEY:
        description: 'Gemini API key for LLM veto review'
        required: false

permissions:
  contents: read

jobs:
  automerge:
    name: Automerge
    if: github.repository_owner == 'kachick' # Specialized for personal use; skip on forks and other owners
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Generate GitHub Apps token
        id: publish-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
          # Required because repository labels (gh label create) belong to the Issues API in GitHub REST
          permission-issues: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          # access-tokens: Prevent GitHub API rate limiting during `nix run github:`
          extra-conf: |
            access-tokens = github.com=${{ github.token }}
            extra-substituters = https://kachick.cachix.org
            extra-trusted-public-keys = kachick.cachix.org-1:7giZGKW03gPFkbde09JNpDKCbDGGwBuU/Z11W/jUtEQ=

      - name: Merge eligible bot PRs
        env:
          GH_TOKEN: ${{ steps.publish-token.outputs.token }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
          MERGE_METHOD: ${{ inputs.merge-method }}
          ALLOWED_BOTS: ${{ inputs.allowed-bots }}
          LLM_VETO: ${{ inputs.llm-veto }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.gemini-model }}
          REVIEWER: ${{ inputs.reviewer }}
        run: |
          set -euo pipefail

          if [ -n "${WORKFLOW_REPOSITORY}" ] && [ -n "${WORKFLOW_SHA}" ]; then
            FLAKE_REF="github:${WORKFLOW_REPOSITORY}/${WORKFLOW_SHA}"
          else
            FLAKE_REF="."
          fi

          # Pass GEMINI_API_KEY via env rather than --gemini-api-key to keep it out of process arguments (ps)
          nix run "${FLAKE_REF}#automerge" -- \
            --merge-method="${MERGE_METHOD}" \
            --allowed-bots="${ALLOWED_BOTS}" \
            --llm-veto="${LLM_VETO}" \
            --gemini-model="${GEMINI_MODEL}" \
            --reviewer="${REVIEWER}"
