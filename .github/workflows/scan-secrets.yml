name: 🙈
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  betterleaks:
    uses: $/.github/workflows/reusable-betterleaks.yml
    with:
      betterleaks-version: '1.9.0' # selfup {"extract":"\\d[^']+","replacer":["betterleaks", "version"]}
