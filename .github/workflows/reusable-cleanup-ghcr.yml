name: '[Reusable] Cleanup GHCR package versions'

on:
  workflow_call:
    inputs:
      package-name:
        description: 'Package name under repository owner (e.g. home)'
        required: true
        type: string
      keep-latest-items:
        description: 'Number of latest package versions to keep'
        required: false
        type: number
        default: 50

permissions: {}

jobs:
  cleanup:
    name: 🗑️ GHCR
    if: github.repository_owner == 'kachick' # Specialized for personal use; skip on forks and other owners
    permissions:
      packages: write # Required for deleting old GHCR package versions
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          # access-tokens: Prevent GitHub API rate limiting during `nix run github:`
          extra-conf: |
            access-tokens = github.com=${{ github.token }}
            extra-substituters = https://kachick.cachix.org
            extra-trusted-public-keys = kachick.cachix.org-1:7giZGKW03gPFkbde09JNpDKCbDGGwBuU/Z11W/jUtEQ=

      - name: Delete old package versions
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          PACKAGE_NAME: ${{ inputs.package-name }}
          KEEP_LATEST_ITEMS: ${{ inputs.keep-latest-items }}
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
        run: |
          set -euo pipefail

          if [ -n "${WORKFLOW_REPOSITORY}" ] && [ -n "${WORKFLOW_SHA}" ]; then
            FLAKE_REF="github:${WORKFLOW_REPOSITORY}/${WORKFLOW_SHA}"
          else
            FLAKE_REF="."
          fi

          nix run "${FLAKE_REF}#cleanup-ghcr" -- --mode=prune
