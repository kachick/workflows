name: '[Reusable] Cleanup GHCR package versions'

on:
  workflow_call:
    inputs:
      package-name:
        description: 'Package name under repository owner (e.g. home)'
        required: true
        type: string
      keep-latest-items:
        description: 'Number of latest package versions to keep'
        required: false
        type: number
        default: 50

permissions:
  contents: read

jobs:
  cleanup:
    name: 🗑️ GHCR
    if: github.repository_owner == 'kachick' # Specialized for personal use; skip on forks and other owners
    permissions:
      packages: write # Required for deleting old GHCR package versions
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Delete old package versions
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          PACKAGE_NAME: ${{ inputs.package-name }}
          KEEP_LATEST_ITEMS: ${{ inputs.keep-latest-items }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: | #shell
          # Call REST API directly to avoid depending on inactive actions/delete-package-versions
          # Fetch all versions, sort by created_at, keep the newest N items, and delete oldest versions (up to 100 per run)
          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/users/${REPOSITORY_OWNER}/packages/container/${PACKAGE_NAME}/versions" \
            --jq '.[] | "\(.id)\t\(.created_at)"' | \
            ruby -e '
              require "time"
              keep = Integer(ENV.fetch("KEEP_LATEST_ITEMS"))
              versions = STDIN.each_line.map { |line|
                id, created_at = line.chomp.split("\t")
                { id: id, created_at: Time.parse(created_at) }
              }
              versions.sort_by! { |v| [v[:created_at], v[:id].to_i] }
              to_delete_count = [versions.length - keep, 0].max
              to_delete = versions.first([to_delete_count, 100].min)
              to_delete.each { |v| puts v[:id] }
            ' | \
            xargs --no-run-if-empty --replace='{id}' \
              gh api --method DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/users/${REPOSITORY_OWNER}/packages/container/${PACKAGE_NAME}/versions/{id}"
