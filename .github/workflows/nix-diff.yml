name: ❄️ Diff
on:
  pull_request:
    paths:
      - 'flake.lock'
      - '.github/workflows/nix-diff.yml'
      - '.github/workflows/reusable-nix-diff-closures.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  diff:
    uses: $/.github/workflows/reusable-nix-diff-closures.yml
    with:
      runs-on: ubuntu-26.04
      targets: devShells.x86_64-linux.default
