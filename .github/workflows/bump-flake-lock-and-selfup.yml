name: 🤖🆙❄️

permissions:
  contents: read

on:
  schedule:
    # 1st of every month at 05:29 UTC (14:29 JST)
    # Minute and hour are distributed across repositories using CRC32
    - cron: '29 5 1 * *'
  workflow_dispatch:

jobs:
  bump:
    uses: $/.github/workflows/reusable-bump-flake-lock.yml
    with:
      app-id: ${{ vars.SAMU_APP_ID }}
      post-commit-lock-file: nix develop --command task selfup
      post-commit-lock-file-title: 'Sync CI dependencies with nixpkgs'
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.SAMU_APP_PRIVATE_KEY }}
