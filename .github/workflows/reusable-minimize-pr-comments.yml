name: '[Reusable] Minimize PR comments'

on:
  workflow_call:
    inputs:
      pr-number:
        description: 'Target PR number'
        required: true
        type: number
      body-includes:
        description: 'Substring pattern to match in comment body'
        required: true
        type: string

permissions:
  contents: read

jobs:
  minimize:
    name: 💬 Minimize
    if: github.repository_owner == 'kachick' # Specialized for personal use; skip on forks and other owners
    permissions:
      pull-requests: write # Required for minimizing outdated PR comments
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          # access-tokens: Prevent GitHub API rate limiting during `nix run github:`
          extra-conf: |
            access-tokens = github.com=${{ github.token }}
            extra-substituters = https://kachick.cachix.org
            extra-trusted-public-keys = kachick.cachix.org-1:7giZGKW03gPFkbde09JNpDKCbDGGwBuU/Z11W/jUtEQ=

      - name: Minimize matching PR comments
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          BODY_INCLUDES: ${{ inputs.body-includes }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail

          if [ -n "${WORKFLOW_REPOSITORY}" ] && [ -n "${WORKFLOW_SHA}" ]; then
            FLAKE_REF="github:${WORKFLOW_REPOSITORY}/${WORKFLOW_SHA}"
          else
            FLAKE_REF="."
          fi

          nix run "${FLAKE_REF}#minimize-pr-comments" -- \
            --pr="${PR_NUMBER}" \
            --marker="${BODY_INCLUDES}"
