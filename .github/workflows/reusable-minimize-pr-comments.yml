name: '[Reusable] Minimize PR comments'

on:
  workflow_call:
    inputs:
      pr-number:
        description: 'Target PR number'
        required: true
        type: number
      body-includes:
        description: 'Substring pattern to match in comment body'
        required: true
        type: string

permissions:
  contents: read

jobs:
  minimize:
    name: 💬 Minimize
    if: github.repository_owner == 'kachick' # Specialized for personal use; skip on forks and other owners
    permissions:
      pull-requests: write # Required for minimizing outdated PR comments
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      # Need checkout before using gh and repo placeholders
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Minimize old comments
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          BODY_INCLUDES: ${{ inputs.body-includes }}
        # Applied reason will be different caused on GitHub bug, See https://github.com/orgs/community/discussions/19865
        run: |
          gh api -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/{owner}/{repo}/issues/${PR_NUMBER}/comments" --paginate | \
              jq --arg pattern "$BODY_INCLUDES" '.[] |
                select(.user.login == "github-actions[bot]" and (.body | contains($pattern))) |
                .node_id' | \
                  xargs --no-run-if-empty --replace='{node_id}' \
                    gh api graphql --raw-field subjectId="{node_id}" \
                      --raw-field query='mutation($subjectId:ID!) {
                        minimizeComment(input: { subjectId: $subjectId, classifier: OUTDATED }) {
                          clientMutationId
                          minimizedComment {
                            isMinimized
                            minimizedReason
                            viewerCanMinimize
                          }
                        }
                      }'
