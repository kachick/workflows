name: '[Reusable] Bump flake.lock'

on:
  workflow_call:
    inputs:
      app-id:
        description: 'GitHub App ID or Client ID'
        required: true
        type: string
      post-commit-lock-file:
        description: 'Command to run after updating flake.lock (e.g. nix run .#update-deps)'
        required: false
        type: string
        default: ''
      post-commit-lock-file-title:
        description: 'Commit message for changes from post-commit-lock-file (defaults to the executed command)'
        required: false
        type: string
        default: ''
      pr-title:
        description: 'Title for the pull request'
        required: false
        type: string
        default: 'Bump flake.lock and related dependencies'
      pr-body:
        description: 'Additional body for the pull request'
        required: false
        type: string
        default: ''
      branch-name:
        description: 'Branch name to push the changes to'
        required: false
        type: string
        default: 'bot-update-flake-lock'
    secrets:
      APP_PRIVATE_KEY:
        description: 'GitHub App private key'
        required: true

permissions:
  contents: read

jobs:
  bump:
    name: Bump flake.lock
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Generate GitHub Apps token
        id: publish-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.publish-token.outputs.token }}
          # This workflow depends on stored credentials for the subsequent git push command
          persist-credentials: true

      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          # access-tokens: Prevent GitHub API rate limiting during `nix run github:`
          extra-conf: |
            access-tokens = github.com=${{ github.token }}

      - name: Bump flake.lock and create PR
        env:
          GITHUB_TOKEN: ${{ steps.publish-token.outputs.token }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
          PR_BRANCH: ${{ inputs.branch-name }}
          POST_COMMAND: ${{ inputs.post-commit-lock-file }}
          POST_COMMIT_TITLE: ${{ inputs.post-commit-lock-file-title }}
          PR_TITLE: ${{ inputs.pr-title }}
          PR_BODY: ${{ inputs.pr-body }}
        run: |
          set -euo pipefail

          if [ -n "${WORKFLOW_REPOSITORY}" ] && [ -n "${WORKFLOW_SHA}" ]; then
            FLAKE_REF="github:${WORKFLOW_REPOSITORY}/${WORKFLOW_SHA}"
          else
            FLAKE_REF="."
          fi

          nix run "${FLAKE_REF}#bump-flake-lock" -- \
            --branch-name="${PR_BRANCH}" \
            --post-command="${POST_COMMAND}" \
            --post-commit-title="${POST_COMMIT_TITLE}" \
            --pr-title="${PR_TITLE}" \
            --pr-body="${PR_BODY}"
