name: '[Reusable] Nix Closure Diff'

on:
  workflow_call:
    inputs:
      # Exceptional input: evaluating and building Nix derivations must match
      # the system architecture of the target repository (such as macOS or specific Linux platforms).
      # All other reusable workflows in this repository must use fixed runners without a runs-on input.
      runs-on:
        description: 'Runner image (e.g. ubuntu-26.04)'
        required: true
        type: string
      base-sha:
        description: 'Base commit SHA (defaults to PR base SHA)'
        required: false
        type: string
        default: ''
      targets:
        description: 'Newline- or comma-separated list of flake targets (e.g. devShells.x86_64-linux.default)'
        required: true
        type: string
      post-comment:
        description: 'Whether to post comment on pull request'
        required: false
        type: boolean
        default: true
      max-size:
        description: 'Max characters before truncating comment'
        required: false
        type: number
        default: 45000
      head-size:
        description: 'Max characters preview for truncated comments'
        required: false
        type: number
        default: 40000

permissions:
  contents: read

jobs:
  diff:
    name: Diff closures
    permissions:
      contents: read
      pull-requests: write # Post closure differences to PR comments
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          # access-tokens: Prevent GitHub API rate limiting during `nix run github:`
          extra-conf: |
            access-tokens = github.com=${{ github.token }}
            extra-trusted-substituters = https://nix-community.cachix.org https://cache.numtide.com https://selfup.cachix.org https://kachick-dotfiles.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= selfup.cachix.org-1:eY2eEd955BmRI7SultbRIV81vApqpJixunkV3XlXuT8= kachick-dotfiles.cachix.org-1:XhiP3JOkqNFGludaN+/send30shcrn1UMDeRL9XttkI=

      - name: Compute closure differences and post comment
        id: diff
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ inputs.base-sha != '' && inputs.base-sha || github.event.pull_request.base.sha }}
          TARGETS: ${{ inputs.targets }}
          POST_COMMENT: ${{ inputs.post-comment }}
          MAX_SIZE: ${{ inputs.max-size }}
          HEAD_SIZE: ${{ inputs.head-size }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
        run: |
          set -euo pipefail

          if [ -n "${WORKFLOW_REPOSITORY}" ] && [ -n "${WORKFLOW_SHA}" ]; then
            FLAKE_REF="github:${WORKFLOW_REPOSITORY}/${WORKFLOW_SHA}"
          else
            FLAKE_REF="."
          fi

          nix run "${FLAKE_REF}#nix-diff-closures" -- \
            --base-rev="${BASE_SHA}" \
            --targets="${TARGETS}" \
            --post-comment="${POST_COMMENT}" \
            --max-size="${MAX_SIZE}" \
            --head-size="${HEAD_SIZE}" \
            --output-comment="${RUNNER_TEMP}/comment.md" \
            --output-full-diff="${RUNNER_TEMP}/diff.txt"

      - name: Upload full diff artifact
        if: steps.diff.outputs.is_truncated == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nix-diff-full
          path: ${{ runner.temp }}/diff.txt
