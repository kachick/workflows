name: '[Reusable] Scan Secrets with betterleaks'

on:
  workflow_call:
    inputs:
      nix-store-hash:
        description: 'Store hash of betterleaks in cache.nixos.org (32 characters Base32)'
        required: true
        type: string
      runs-on:
        description: 'Runner image'
        required: false
        type: string
        default: 'ubuntu-slim'

permissions:
  contents: read

jobs:
  betterleaks:
    name: betterleaks
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    steps:
      - name: Download betterleaks from nixpkgs binary cache
        working-directory: ${{ runner.temp }}
        env:
          STORE_HASH: ${{ inputs.nix-store-hash }}
        # Fetch the pre-built pure Go binary from cache.nixos.org without installing Nix
        run: |
          set -euo pipefail

          if ! command -v zstd >/dev/null 2>&1 || ! command -v ruby >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends zstd ruby
          fi

          echo "Fetching narinfo for store hash ${STORE_HASH}..."
          NARINFO=$(curl -sSfL "https://cache.nixos.org/${STORE_HASH}.narinfo")
          NAR_URL=$(echo "${NARINFO}" | awk '/^URL: /{print $2}')

          if [ -z "${NAR_URL}" ]; then
            echo "Failed to extract NAR URL from narinfo" >&2
            exit 1
          fi

          echo "Downloading and decompressing https://cache.nixos.org/${NAR_URL}..."
          curl -sSfL "https://cache.nixos.org/${NAR_URL}" | zstd -d > "${RUNNER_TEMP}/betterleaks.nar"

      - name: Unpack NAR archive
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail

          cat << 'EOF' > "${RUNNER_TEMP}/unpack_nar.rb"
          require 'fileutils'

          def read_str(io)
            len_bytes = io.read(8)
            return nil unless len_bytes
            len = len_bytes.unpack1('Q<')
            str = io.read(len)
            pad = (8 - (len % 8)) % 8
            io.read(pad) if pad > 0
            str
          end

          def read_contents(io, path)
            len_bytes = io.read(8)
            len = len_bytes.unpack1('Q<')
            File.open(path, 'wb') do |out|
              remaining = len
              while remaining > 0
                chunk = io.read([remaining, 65536].min)
                out.write(chunk)
                remaining -= chunk.bytesize
              end
            end
            pad = (8 - (len % 8)) % 8
            io.read(pad) if pad > 0
          end

          def unpack_node(io, dest)
            assert_token(io, '(')
            assert_token(io, 'type')
            type = read_str(io)
            case type
            when 'directory'
              FileUtils.mkdir_p(dest)
              loop do
                tok = read_str(io)
                break if tok == ')'
                raise "Expected entry, got #{tok}" unless tok == 'entry'
                assert_token(io, '(')
                assert_token(io, 'name')
                name = read_str(io)
                assert_token(io, 'node')
                unpack_node(io, File.join(dest, name))
                assert_token(io, ')')
              end
            when 'regular'
              executable = false
              loop do
                tok = read_str(io)
                case tok
                when 'executable'
                  read_str(io)
                  executable = true
                when 'contents'
                  read_contents(io, dest)
                  File.chmod(executable ? 0755 : 0644, dest)
                  assert_token(io, ')')
                  break
                end
              end
            when 'symlink'
              assert_token(io, 'target')
              target = read_str(io)
              File.symlink(target, dest)
              assert_token(io, ')')
            else
              raise "Unknown type: #{type}"
            end
          end

          def assert_token(io, expected)
            tok = read_str(io)
            raise "Expected #{expected}, got #{tok}" unless tok == expected
          end

          nar_path, dest_dir = ARGV
          File.open(nar_path, 'rb') do |f|
            tag = read_str(f)
            raise "Bad tag: #{tag}" unless tag == 'nix-archive-1'
            unpack_node(f, dest_dir)
          end
          EOF

          DEST_DIR="${RUNNER_TEMP}/betterleaks-extracted"
          ruby "${RUNNER_TEMP}/unpack_nar.rb" "${RUNNER_TEMP}/betterleaks.nar" "${DEST_DIR}"

          echo "${DEST_DIR}/bin" >> "${GITHUB_PATH}"

      - name: Make sure installed betterleaks version
        run: 'betterleaks version'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Getting all refs for git mode
          persist-credentials: false

      - name: Run
        # For CI use in public repositories, ensuring full-redact does not ensure to avoid actual problems, should not forget it :)
        run: |
          betterleaks git . --redact=100
