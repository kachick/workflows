name: 🤖👌🤖

permissions:
  contents: read

on:
  schedule:
    # 29 is not strict; it comes from: `gh api repos/:owner/:repo --jq '.id % 60'`
    - cron: '29 */6 * * *'
  workflow_dispatch:

jobs:
  automerge:
    uses: $/.github/workflows/reusable-automerge.yml
    with:
      app-id: ${{ vars.SAMU_APP_ID }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.SAMU_APP_PRIVATE_KEY }}
