# https://taskfile.dev/styleguide/
# Avoid chaining commands with ; or && in a single line. Use multiple cmd items for independent steps, or write a script under scripts/ instead.

version: '3'

tasks:
  default:
    deps:
      - task: fmt
      - task: lint
      - task: test
  check:
    deps:
      - task: test
      - task: lint
  test:
    cmds:
      - CGO_ENABLED=0 go test -v ./...
  fmt:
    cmds:
      - dprint fmt
  fix:
    cmds:
      - CGO_ENABLED=0 go fix ./...
  lint:
    cmds:
      - CGO_ENABLED=0 go vet ./...
      - CGO_ENABLED=0 go fix -diff ./...
      - CGO_ENABLED=0 go mod tidy -diff
      - go run ./cmd/workflowlint
      - dprint check
      - typos . .github
      - git ls-files -z '*.sh' '*.bash' | xargs --null --no-run-if-empty shellcheck
      - zizmor --pedantic .
      - osv-scanner scan --no-call-analysis=go -r .
      - git ls-files | xargs nix run github:kachick/selfup/v1.3.1 -- list -check
  scan-secrets:
    cmds:
      - betterleaks git --config .betterleaks.toml
  selfup:
    cmds:
      - git ls-files | xargs nix run github:kachick/selfup/v1.3.1 -- run
