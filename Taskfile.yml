# https://taskfile.dev

version: '3'

tasks:
  default:
    deps:
      - task: fmt
      - task: lint
      - task: test
  check:
    deps:
      - task: test
      - task: lint
  test:
    cmds:
      - CGO_ENABLED=0 go test -v ./...
  fmt:
    cmds:
      - go fmt ./...
      - dprint fmt
  lint:
    cmds:
      - CGO_ENABLED=0 go vet ./...
      - dprint check
      - typos . .github .vscode
      - zizmor .
      - git ls-files | xargs nix run github:kachick/selfup/v1.3.1 -- list -check
  selfup:
    cmds:
      - git ls-files | xargs nix run github:kachick/selfup/v1.3.1 -- run
